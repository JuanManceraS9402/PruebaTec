[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simon-geo"
version = "0.1.0"
description = "Pipeline geoespacial Bronce/Plata/Oro para telemetría vehicular IoT/AVL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "psycopg[binary,pool]>=3.1",
  "psycopg-pool>=3.2",  # ConnectionPool(check=...)
  "shapely>=2.0",
  "pyproj>=3.6",
  "geopandas>=0.14",
  "pandas>=2.2",
  "numpy>=1.26",
  "httpx>=0.27",
]

[project.optional-dependencies]
dashboard = [
  "streamlit>=1.35",
  "pydeck>=0.9",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"simon_geo.seed" = ["data/*.geojson"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = [
  # aviso interno de starlette sobre su propio TestClient; no es código del proyecto
  "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
]
markers = [
  "integration: requiere la base de datos PostGIS levantada (docker compose up -d)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
