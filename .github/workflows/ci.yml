name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Lint + tests unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: pytest -m "not integration" --cov=simon_geo --cov-report=term-missing

  integration:
    name: Integración con PostGIS (docker compose)
    runs-on: ubuntu-latest
    needs: unit
    env:
      REQUIRE_DB: "1" # si la BD no responde, los tests fallan en vez de saltarse
    steps:
      - uses: actions/checkout@v4

      # Exactamente el mismo despliegue que describe SETUP.md
      - name: Levantar PostGIS con los scripts de db/init
        run: docker compose up -d --wait

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Cargar escenario Bogotá
        run: python -m simon_geo.seed

      - name: Tests de integración
        run: pytest -m integration -v

      - name: Logs de la base de datos (si algo falló)
        if: failure()
        run: docker compose logs db
